<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Órdenes de Compra SAP</title><style>:root{color-scheme:light dark;--ink:#16251c;--paper:#f6f7f4;--panel:#fff;--green:#17633a;--mint:#dff2e5;--line:#d7ddd7;--warn:#8b5600}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,sans-serif}.shell{max-width:1050px;margin:auto;padding:28px}header{border-bottom:4px solid var(--green);padding:14px 0 22px;display:flex;justify-content:space-between;align-items:end}h1{font:700 28px/1.1 Georgia,serif;margin:0}.subtitle{margin:5px 0 0;opacity:.7}.badge{font-size:12px;background:var(--mint);color:var(--green);padding:6px 9px;border-radius:3px;font-weight:700}.chat{min-height:60vh;padding:24px 0}.msg{max-width:82%;padding:14px 16px;margin:10px 0;border:1px solid var(--line);background:var(--panel)}.user{margin-left:auto;border-color:var(--green)}.assistant{border-left:4px solid var(--green)}.confirmation{background:#fff2d8;border-color:#e5af49}.tools{margin-top:10px}.tool{font:12px ui-monospace,SFMono-Regular,monospace;background:#eef2ed;padding:9px;margin:5px 0;overflow:auto}.composer{position:sticky;bottom:0;background:var(--paper);padding:12px 0;display:flex;gap:8px}input{flex:1;border:1px solid var(--line);padding:13px;font:inherit;background:var(--panel);color:inherit}button{background:var(--green);color:white;border:0;padding:0 20px;font-weight:700;cursor:pointer}button:focus,input:focus{outline:3px solid #8bd8a4;outline-offset:2px}@media(max-width:600px){.shell{padding:16px}.msg{max-width:94%}header{display:block}.badge{display:inline-block;margin-top:12px}}</style></head><body><main class="shell"><header><div><h1>Órdenes de Compra SAP</h1><p class="subtitle">Asistente de preparación y control · SAP simulado</p></div><span class="badge">HERRAMIENTAS VISIBLES</span></header><section class="chat" id="chat"><article class="msg assistant">Indica una solicitud, por ejemplo: <strong>Procesa sol-004</strong>.</article></section><form class="composer" id="form"><input id="message" autocomplete="off" placeholder="Procesa la solicitud sol-001" aria-label="Mensaje"><button>Enviar</button></form></main><script src="/app.js"></script></body></html>
